name: Build GeroGrain VST3
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Source/**'
      - 'CMakeLists.txt'
      - 'BaseGranulare.png'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check Xcode
        run: xcodebuild -version
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DJUCE_BUILD_EXAMPLES=OFF -DJUCE_BUILD_EXTRAS=OFF
      - name: Build VST3
        run: cmake --build build --config Release --target GeroGrain_VST3 -j 2
      - name: Package plugin
        run: |
          mkdir -p artifacts
          cd build/GeroGrain_artefacts/Release/VST3
          ditto "GeroGrain.vst3" "$GITHUB_WORKSPACE/artifacts/GeroGrain.vst3"
          cd "$GITHUB_WORKSPACE"
          ditto -c -k --sequesterRsrc --keepParent artifacts/GeroGrain.vst3 GeroGrain-macOS-VST3.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GeroGrain-macOS-VST3
          path: GeroGrain-macOS-VST3.zip
          if-no-files-found: error
